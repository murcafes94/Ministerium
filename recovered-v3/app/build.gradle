apply plugin: 'com.android.application'

android {
    compileSdkVersion 30

    signingConfigs {
        testStable {
            storeFile file('../test-signing/ministerium-test.keystore')
            storePassword 'ministerium-test'
            keyAlias 'ministerium-test'
            keyPassword 'ministerium-test'
        }
    }

    defaultConfig {
        applicationId 'com.fabri.ministerium'
        minSdkVersion 23
        targetSdkVersion 30
        versionCode 32
        versionName '3.1.1'
    }

    buildTypes {
        debug {
            // Test builds intentionally use a separate package and a public,
            // non-production signing key so consecutive CI APKs can update the
            // installed Ministerium Test app without touching stable data.
            applicationIdSuffix '.test'
            versionNameSuffix '-test'
            signingConfig signingConfigs.testStable
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lintOptions {
        abortOnError true
        checkReleaseBuilds false
    }
}

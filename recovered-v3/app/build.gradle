apply plugin: 'com.android.application'

android {
    compileSdkVersion 30

    defaultConfig {
        applicationId 'com.fabri.ministerium'
        minSdkVersion 23
        targetSdkVersion 30
        versionCode 32
        versionName '3.1.1'
    }

    buildTypes {
        debug {
            // GitHub-hosted runners create a new debug signing key on fresh machines.
            // Keep CI/test APKs separate from the installed stable package so they can
            // always be installed side-by-side without signature conflicts.
            applicationIdSuffix '.test'
            versionNameSuffix '-test'
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lintOptions {
        abortOnError true
        checkReleaseBuilds false
    }
}

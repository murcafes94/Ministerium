name: Validar proyecto

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  content:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validar estructura del proyecto
        run: node tools/validate_project.mjs
      - name: Validar contenidos
        run: node tools/validate_content.mjs

name: Ministerium 4.2 Private APK

on:
  push:
    branches:
      - codex/private-4.2-build

permissions:
  contents: read
  actions: read

jobs:
  build-private:
    name: Build private 2026 APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply private-edition source patch
        run: git apply --check .github/private-hours.patch && git apply .github/private-hours.patch

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install content preprocessing dependencies
        run: python -m pip install --disable-pip-version-check pypdf beautifulsoup4

      - name: Import 2026 private Hours package
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --filter=blob:none --sparse \
            https://github.com/liturgiadelashoras/liturgiadelashoras.github.io.git \
            "$RUNNER_TEMP/liturgiadelashoras"
          git -C "$RUNNER_TEMP/liturgiadelashoras" sparse-checkout set sync/2026
          python recovered-v3/tools/build_private_hours.py \
            "$RUNNER_TEMP/liturgiadelashoras" --year 2026 \
            --output recovered-v3/app/src/privateEdition/assets/private-hours
          test "$(find recovered-v3/app/src/privateEdition/assets/private-hours/2026 -type f | wc -l)" -gt 300

      - name: Build clean Hours packages
        working-directory: recovered-v3
        run: |
          python tools/build_clean_hours_31.py --volume all
          python tools/build_clean_latin_hours_31.py
          test -s app/src/main/assets/hours-clean/manifest.json
          test -s app/src/main/assets/hours-clean/latin/2026/manifest.json

      - name: Restore known-good Missal and Ritual packages
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "repos/${GITHUB_REPOSITORY}/actions/artifacts/9897241215/zip" \
            > "$RUNNER_TEMP/ministerium-previous.zip"
          mkdir -p "$RUNNER_TEMP/ministerium-previous" "$RUNNER_TEMP/ministerium-apk"
          unzip -q "$RUNNER_TEMP/ministerium-previous.zip" -d "$RUNNER_TEMP/ministerium-previous"
          previous_apk="$(find "$RUNNER_TEMP/ministerium-previous" -type f -name '*.apk' -print -quit)"
          test -n "$previous_apk"
          unzip -q "$previous_apk" 'assets/missal/*' 'assets/rituals/liturgiapapal/*' \
            -d "$RUNNER_TEMP/ministerium-apk"
          rm -rf recovered-v3/app/src/main/assets/missal recovered-v3/app/src/main/assets/rituals/liturgiapapal
          mkdir -p recovered-v3/app/src/main/assets/rituals
          cp -a "$RUNNER_TEMP/ministerium-apk/assets/missal" recovered-v3/app/src/main/assets/missal
          cp -a "$RUNNER_TEMP/ministerium-apk/assets/rituals/liturgiapapal" \
            recovered-v3/app/src/main/assets/rituals/liturgiapapal
          test -s recovered-v3/app/src/main/assets/missal/manifest.json
          test -s recovered-v3/app/src/main/assets/rituals/liturgiapapal/manifest.json

      - name: Build local indexes
        working-directory: recovered-v3
        run: |
          python tools/build_missal_reference_catalog.py
          python tools/build_bible_search_index.py
          python tools/build_magisterium_index_40.py
          test -s app/src/main/assets/missal-reference-catalog.json
          test -s app/src/main/assets/bible-search-index.tsv
          test -s app/src/main/assets/magisterium-index.tsv

      - name: Remove build-time source files
        working-directory: recovered-v3
        run: |
          rm -f \
            'app/src/main/assets/epubs/LH - 1. ADVIENTO.epub' \
            'app/src/main/assets/epubs/LH - 2. NAVIDAD.epub' \
            'app/src/main/assets/epubs/LH - 3. CUARESMA.epub' \
            'app/src/main/assets/epubs/LH - 4. PASCUA.epub' \
            'app/src/main/assets/epubs/LH - 5. TIEMPO ORDINARIO.epub' \
            'app/src/main/assets/epubs/LH - 6. SANTORAL.epub' \
            'app/src/main/assets/epubs/Liturgia-horarum-2026-latin.epub' \
            'app/src/main/assets/pdfs/Comentarios-Codigo-Derecho-Canonico-2001.pdf'

      - name: Prepare stable test signing key
        working-directory: recovered-v3
        run: |
          base64 -d test-signing/ministerium-test.keystore.b64 > test-signing/ministerium-test.keystore
          test -s test-signing/ministerium-test.keystore

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
          cache: gradle

      - name: Build private debug APK
        working-directory: recovered-v3
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assemblePrivateEditionDebug

      - name: Verify and hash APK
        shell: bash
        run: |
          set -euo pipefail
          apk="$(find recovered-v3/app/build/outputs/apk/privateEdition/debug -type f -name '*.apk' -print -quit)"
          test -n "$apk"
          unzip -tq "$apk"
          sha256sum "$apk" | tee "${apk}.sha256"

      - name: Upload private APK
        uses: actions/upload-artifact@v4
        with:
          name: Ministerium-4.2-private-LH-2026
          path: |
            recovered-v3/app/build/outputs/apk/privateEdition/debug/*.apk
            recovered-v3/app/build/outputs/apk/privateEdition/debug/*.sha256
          if-no-files-found: error
          retention-days: 3

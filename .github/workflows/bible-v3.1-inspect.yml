name: Semantic Core 3.1 Inspect

on:
  push:
    branches: [ feature/bible-semantic-v3.1 ]
    paths:
      - '.github/workflows/bible-v3.1-inspect.yml'
      - 'app/**'
      - 'migration/**'
      - 'docs/**'
      - 'tools/bible_import/**'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    name: Reconstruct and inspect semantic core
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Test Bible semantic importers
        shell: bash
        run: python3 tools/bible_import/test_import.py

      - name: Reconstruct Ministerium 3.0 project
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/ministerium-v3.zip"
          : > "$OUT"
          cat "ministerium-v3.zip (1).part-00" >> "$OUT"
          cat "ministerium-v3.zip (1).part-01" >> "$OUT"
          cat "bootstrap/v3/ministerium-v3.zip (1).part-02" >> "$OUT"
          cat bootstrap/v3/ministerium-v3.zip.part-03 >> "$OUT"
          cat bootstrap/v3/ministerium-v3.zip.part-04 >> "$OUT"
          cat bootstrap/v3/ministerium-v3.zip.part-05 >> "$OUT"
          cat bootstrap/v3/ministerium-v3.zip.part-06 >> "$OUT"
          EXPECTED=$(awk '{print $1}' bootstrap/v3/ministerium-v3.zip.sha256)
          ACTUAL=$(sha256sum "$OUT" | awk '{print $1}')
          echo "Expected SHA-256: $EXPECTED"
          echo "Actual SHA-256:   $ACTUAL"
          test "$EXPECTED" = "$ACTUAL"
          unzip -tq "$OUT"
          rm -rf "$RUNNER_TEMP/ministerium-v3"
          mkdir -p "$RUNNER_TEMP/ministerium-v3"
          unzip -q "$OUT" -d "$RUNNER_TEMP/ministerium-v3"
          rsync -a --exclude='.git/' "$RUNNER_TEMP/ministerium-v3/" ./

      - name: Inspect version validation contract
        shell: bash
        run: |
          echo '=== validate_project version checks ==='
          sed -n '150,215p' tools/validate_project.mjs || true
          echo '=== files mentioning version 3.0.0 / versionCode 30 ==='
          grep -RInE "3\.0\.0|versionCode 30|versionName '3\.0\.0'" tools distribution app/src/main --include='*.mjs' --include='*.json' --include='*.java' --include='*.xml' 2>/dev/null | head -120 || true

      - name: Print technical inventory only
        shell: bash
        run: |
          set -euo pipefail
          echo '=== Android project ==='
          sed -n '1,220p' app/build.gradle || true
          echo '=== Manifest package/components ==='
          grep -E 'package=|android:name=|<activity|<service|<provider' app/src/main/AndroidManifest.xml | head -140 || true
          echo '=== Source files related to Bible/Missal/reader/content ==='
          find app/src/main -type f \( -name '*.java' -o -name '*.kt' \) | grep -Ei 'bibl|reader|epub|lection|lectur|missal|misa|content|note|highlight|bookmark|calendar|liturg' | sort | head -350 || true
          echo '=== Source language counts ==='
          printf 'Java: '; find app/src/main -type f -name '*.java' | wc -l
          printf 'Kotlin: '; find app/src/main -type f -name '*.kt' | wc -l

      - name: Inspect legacy integration points
        shell: bash
        run: |
          set -euo pipefail
          for f in \
            app/src/main/java/com/fabri/ministerium/BibleRepository.java \
            app/src/main/java/com/fabri/ministerium/BibleChapterDocument.java \
            app/src/main/java/com/fabri/ministerium/BibleReaderActivity.java \
            app/src/main/java/com/fabri/ministerium/MissalProperRepository.java \
            app/src/main/java/com/fabri/ministerium/LiturgicalResolver.java \
            app/src/main/java/com/fabri/ministerium/CombinedMassActivity.java; do
            echo "===== $f ====="
            sed -n '1,360p' "$f" || true
          done

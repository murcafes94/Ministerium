name: Semantic Core 3.1 Inspect
on:
  push:
    branches: [ feature/bible-semantic-v3.1 ]
    paths: ['.github/workflows/bible-v3.1-inspect.yml']
  pull_request:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct
        shell: bash
        run: |
          OUT="$RUNNER_TEMP/v3.zip"; : > "$OUT"
          cat "ministerium-v3.zip (1).part-00" "ministerium-v3.zip (1).part-01" "bootstrap/v3/ministerium-v3.zip (1).part-02" bootstrap/v3/ministerium-v3.zip.part-03 bootstrap/v3/ministerium-v3.zip.part-04 bootstrap/v3/ministerium-v3.zip.part-05 bootstrap/v3/ministerium-v3.zip.part-06 >> "$OUT"
          unzip -q "$OUT" -d "$RUNNER_TEMP/v3"
          rsync -a --exclude='.git/' "$RUNNER_TEMP/v3/" ./
      - name: Inspect ritual source metadata
        shell: bash
        run: |
          for f in app/src/main/java/com/fabri/ministerium/RitualRepository.java app/src/main/java/com/fabri/ministerium/RitualCatalogActivity.java app/src/main/java/com/fabri/ministerium/RitualReaderActivity.java app/src/main/res/layout/activity_ritual_catalog.xml app/src/main/res/layout/activity_ritual_reader.xml app/src/main/assets/package-manifest.json; do
            echo =====$f=====
            sed -n '1,700p' "$f" || true
          done

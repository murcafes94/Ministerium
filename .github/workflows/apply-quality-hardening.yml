name: Apply Quality Hardening

on:
  push:
    branches: [main]
    paths:
      - 'recovered-v3/tools/apply_quality_hardening.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patches
        working-directory: recovered-v3
        run: python tools/apply_quality_hardening.py
      - name: Commit generated hardening
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add recovered-v3/app/src/main/java/com/fabri/ministerium/BibleReaderActivity.java
          git diff --cached --quiet && exit 0
          git commit -m 'bible: harden immediate note and bookmark markers'
          git push

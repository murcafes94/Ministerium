name: Apply Dictionary Floating Card

on:
  push:
    branches: [ main ]
    paths:
      - 'recovered-v3/tools/apply_dictionary_floating_card.py'
      - '.github/workflows/apply-dictionary-floating-card.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply floating dictionary card
        working-directory: recovered-v3
        run: python tools/apply_dictionary_floating_card.py
      - name: Commit integration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add recovered-v3/app/src/main/java/com/fabri/ministerium/UniversalSelectionMenu.java
          git diff --cached --quiet && exit 0
          git commit -m 'dictionary: use anchored floating lookup card'
          git push origin main

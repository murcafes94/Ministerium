name: Recovery Android Build

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'recovered-v3/**'
      - 'docs/APK_3_0_AUDIT.md'
      - '.github/workflows/recovery-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-recovered-v3:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: recovered-v3
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17 for Android SDK tools
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-30 build-tools;30.0.3'

      - name: Set up JDK 11 for Gradle 6.7.1 / AGP 4.2.1
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
          cache: gradle
          cache-dependency-path: recovered-v3/**/*.gradle*

      - name: Validate project
        run: |
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml
          grep -q "versionName '3.0.0'" app/build.gradle
          if [ -f tools/validate_project.mjs ]; then node tools/validate_project.mjs; fi
          if [ -f tools/validate_content.mjs ]; then node tools/validate_content.mjs; fi

      - name: Compile debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon clean assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Ministerium-3.0-recovery-debug
          path: recovered-v3/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7

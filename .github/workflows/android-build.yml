name: Android Build

on:
  push:
    branches: [ main ]
    paths:
      - 'app/**'
      - 'bootstrap/v3/ministerium-v3.zip.part-*'
      - 'gradle/**'
      - 'gradlew'
      - 'gradlew.bat'
      - 'build.gradle*'
      - 'settings.gradle*'
      - 'gradle.properties'
      - '.github/workflows/android-build.yml'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Compile Ministerium APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Reconstruct and verify full v3 project
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/ministerium-v3.zip"
          : > "$OUT"
          cat "ministerium-v3.zip (1).part-00" >> "$OUT"
          cat "ministerium-v3.zip (1).part-01" >> "$OUT"
          cat "bootstrap/v3/ministerium-v3.zip (1).part-02" >> "$OUT"
          cat bootstrap/v3/ministerium-v3.zip.part-03 >> "$OUT"
          cat bootstrap/v3/ministerium-v3.zip.part-04 >> "$OUT"
          cat bootstrap/v3/ministerium-v3.zip.part-05 >> "$OUT"
          cat bootstrap/v3/ministerium-v3.zip.part-06 >> "$OUT"
          echo "Reconstructed ZIP SHA-256: $(sha256sum "$OUT" | awk '{print $1}')"
          unzip -tq "$OUT"
          rm -rf "$RUNNER_TEMP/ministerium-v3"
          mkdir -p "$RUNNER_TEMP/ministerium-v3"
          unzip -q "$OUT" -d "$RUNNER_TEMP/ministerium-v3"
          rsync -a --exclude='.git/' "$RUNNER_TEMP/ministerium-v3/" ./

      - name: Apply Android SDK compatibility fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          universal = Path("app/src/main/java/com/fabri/ministerium/UniversalSelectionMenu.java")
          text = universal.read_text()
          text = text.replace(
              "import java.util.UUID;",
              "import java.lang.reflect.Method;\nimport java.util.UUID;",
              1,
          )
          text = text.replace(
              "webView.setCustomSelectionActionModeCallback(",
              "installSelectionCallback(webView, ",
              1,
          )
          helper = """
          
              private static void installSelectionCallback(
                      WebView webView, ActionMode.Callback callback) {
                  try {
                      Method method = WebView.class.getMethod(
                              "setCustomSelectionActionModeCallback", ActionMode.Callback.class);
                      method.invoke(webView, callback);
                  } catch (Exception ignored) {
                      // Compatibilidad con android.jar antiguos.
                  }
              }
          """
          if "installSelectionCallback(webView, " not in text:
              raise SystemExit("UniversalSelectionMenu call not found")
          if "private static void installSelectionCallback" not in text:
              text = text.rsplit("\n}", 1)[0] + helper + "\n}"
          universal.write_text(text)

          continue_store = Path("app/src/main/java/com/fabri/ministerium/ContinueReadingStore.java")
          text = continue_store.read_text()
          text = text.replace(
              "import org.json.JSONObject;",
              "import org.json.JSONArray;\nimport org.json.JSONObject;",
              1,
          )
          text = text.replace(
              "JSONObject.getNames(position.extras)",
              "jsonNames(position.extras)",
              1,
          )
          helper = """
          
              private static String[] jsonNames(JSONObject object) {
                  JSONArray names = object == null ? null : object.names();
                  if (names == null) return new String[0];
                  String[] result = new String[names.length()];
                  for (int i = 0; i < names.length(); i++) {
                      result[i] = names.optString(i, "");
                  }
                  return result;
              }
          """
          if "jsonNames(position.extras)" not in text:
              raise SystemExit("ContinueReadingStore JSON call not found")
          if "private static String[] jsonNames" not in text:
              text = text.rsplit("\n}", 1)[0] + helper + "\n}"
          continue_store.write_text(text)
          PY

      - name: Set up JDK 17 for Android SDK tools
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-30 build-tools;30.0.3'

      - name: Set up JDK 11 for Gradle 6.7.1 / AGP 4.2.1
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
          cache: gradle

      - name: Validate Ministerium 3.0 project
        shell: bash
        run: |
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml
          grep -q "versionName '3.0.0'" app/build.gradle
          if [ -f tools/validate_project.mjs ]; then node tools/validate_project.mjs; fi
          if [ -f tools/validate_content.mjs ]; then node tools/validate_content.mjs; fi

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Compile debug APK
        run: ./gradlew --no-daemon clean assembleDebug

      - name: Calculate SHA-256
        shell: bash
        run: sha256sum app/build/outputs/apk/debug/*.apk | tee apk-sha256.txt

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Ministerium-3.0.0-debug
          path: |
            app/build/outputs/apk/debug/*.apk
            apk-sha256.txt
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(sed -n "s/.*versionName '\([^']*\)'.*/\1/p" app/build.gradle | head -n 1)
          test -n "$VERSION"
          TAG="v$VERSION"
          gh release create "$TAG" \
            app/build/outputs/apk/debug/*.apk \
            apk-sha256.txt \
            --title "Ministerium $VERSION" \
            --generate-notes \
            --latest

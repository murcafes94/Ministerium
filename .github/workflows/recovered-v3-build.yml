name: Legacy Recovered v3 Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-recovered-v3:
    name: Compile legacy recovered Ministerium 3.0
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: recovered-v3

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python for legacy preprocessing
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install preprocessing dependency
        run: python -m pip install 'pypdf>=5,<6'

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
          cache: gradle
          cache-dependency-path: recovered-v3/**/*.gradle*

      - name: Set up Android SDK 30
        uses: android-actions/setup-android@v4

      - name: Install Android platform and build tools
        run: sdkmanager 'platform-tools' 'platforms;android-30' 'build-tools;30.0.3'

      - name: Validate legacy source tree
        shell: bash
        run: |
          set -euo pipefail
          test -f settings.gradle
          test -f build.gradle
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml
          echo 'Legacy recovered source tree available.'

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Compile debug APK
        run: ./gradlew --no-daemon --stacktrace clean assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK=$(find app/build/outputs/apk/debug -name '*.apk' -type f | head -n 1)
          test -n "$APK"
          test -s "$APK"
          sha256sum "$APK" | tee apk-sha256.txt

      - name: Upload legacy recovered APK
        uses: actions/upload-artifact@v4
        with:
          name: Ministerium-legacy-recovered-debug
          path: |
            recovered-v3/app/build/outputs/apk/debug/*.apk
            recovered-v3/apk-sha256.txt
          if-no-files-found: error
          retention-days: 7

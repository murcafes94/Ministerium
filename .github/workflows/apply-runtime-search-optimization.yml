name: Apply Runtime Search Optimization

on:
  push:
    branches: [main]
    paths:
      - 'recovered-v3/tools/apply_runtime_search_optimization.py'
      - '.github/workflows/apply-runtime-search-optimization.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply optimization patch
        working-directory: recovered-v3
        run: python tools/apply_runtime_search_optimization.py
      - name: Commit optimized sources
        run: |
          if git diff --quiet; then
            echo 'No changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add recovered-v3/app/src/main/java/com/fabri/ministerium/SearchActivity.java \
                  recovered-v3/app/src/main/java/com/fabri/ministerium/ContentRepository.java
          git commit -m 'perf: cache repeated searches and bound document pages'
          git push origin HEAD:main

name: Android Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build signed APK and publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Restore release keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "Missing KEYSTORE_BASE64 secret" >&2
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/ministerium-release.jks"

      - name: Build signed release APK
        env:
          MINISTERIUM_KEYSTORE_FILE: ${{ runner.temp }}/ministerium-release.jks
          MINISTERIUM_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          MINISTERIUM_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          MINISTERIUM_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew --no-daemon clean assembleRelease

      - name: Find APK and calculate SHA-256
        id: apk
        shell: bash
        run: |
          APK=$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | head -n 1)
          if [ -z "$APK" ]; then
            echo "Release APK not found" >&2
            exit 1
          fi
          VERSION="${GITHUB_REF_NAME#v}"
          OUT="Ministerium-${VERSION}.apk"
          cp "$APK" "$OUT"
          sha256sum "$OUT" > "${OUT}.sha256"
          echo "file=$OUT" >> "$GITHUB_OUTPUT"
          echo "sha_file=${OUT}.sha256" >> "$GITHUB_OUTPUT"

      - name: Generate update manifest
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          APK="${{ steps.apk.outputs.file }}"
          SHA=$(cut -d ' ' -f1 "${{ steps.apk.outputs.sha_file }}")
          cat > update.json <<EOF
          {
            "channel": "stable",
            "versionName": "$VERSION",
            "tag": "$GITHUB_REF_NAME",
            "apk": "$APK",
            "sha256": "$SHA",
            "mandatory": false,
            "publishedAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            ${{ steps.apk.outputs.file }}
            ${{ steps.apk.outputs.sha_file }}
            update.json

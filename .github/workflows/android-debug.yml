name: Ministerium Android Debug

on:
  workflow_dispatch:
  push:
    branches:
      - fix/combined-mass-single-flow
      - feature/ministerium-3.1-stabilization
      - feature/ministerium-3.1.1-final-fixes
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-debug:
    name: Build debug APK
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: recovered-v3

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install content preprocessing dependencies
        run: python -m pip install --disable-pip-version-check pypdf beautifulsoup4

      - name: Build clean Liturgy of the Hours packages
        run: |
          python tools/build_clean_hours_31.py --volume all
          python tools/build_clean_latin_hours_31.py
          test -s app/src/main/assets/hours-clean/manifest.json
          test -s app/src/main/assets/hours-clean/latin/2026/manifest.json
          test -s app/src/main/assets/hours-clean/latin/2026/files.txt
          for v in advent christmas lent easter ordinary sanctoral; do
            test -s "app/src/main/assets/hours-clean/$v/toc.tsv"
            test -s "app/src/main/assets/hours-clean/$v/files.txt"
            test -s "app/src/main/assets/hours-clean/$v/manifest.json"
          done
          ! grep -R -E '\[(1V|2V|C1|C2|IN|O|L|M)\]' app/src/main/assets/hours-clean/ordinary --include='*.htm' --include='*.html' --include='*.xhtml'

      - name: Build Liturgia Papal packages
        run: |
          python tools/build_liturgiapapal_missal_31.py --language all
          python tools/build_liturgiapapal_rituals_31.py
          test -f app/src/main/assets/missal/es/initial.txt
          test -f app/src/main/assets/missal/es/word.txt
          test -f app/src/main/assets/missal/es/proper_ordinary.txt
          test -f app/src/main/assets/missal/la/initial.txt
          test -f app/src/main/assets/rituals/liturgiapapal/baptism_one_child.txt
          test -f app/src/main/assets/rituals/liturgiapapal/unction.txt
          test -f app/src/main/assets/rituals/liturgiapapal/funeral_typical.txt
          test -f app/src/main/assets/rituals/liturgiapapal/blessing_house.txt

      - name: Build fast Bible search index
        run: |
          python tools/build_bible_search_index.py
          test -s app/src/main/assets/bible-search-index.tsv

      - name: Validate Ministerium 3.1.1 contract
        run: |
          node tools/validate_stabilization_31.mjs
          node tools/validate_calendar_31.mjs

      - name: Remove Liturgy source EPUBs from runtime APK assets
        run: |
          rm -f \
            'app/src/main/assets/epubs/LH - 1. ADVIENTO.epub' \
            'app/src/main/assets/epubs/LH - 2. NAVIDAD.epub' \
            'app/src/main/assets/epubs/LH - 3. CUARESMA.epub' \
            'app/src/main/assets/epubs/LH - 4. PASCUA.epub' \
            'app/src/main/assets/epubs/LH - 5. TIEMPO ORDINARIO.epub' \
            'app/src/main/assets/epubs/LH - 6. SANTORAL.epub' \
            'app/src/main/assets/epubs/Liturgia-horarum-2026-latin.epub'
          test ! -f 'app/src/main/assets/epubs/LH - 5. TIEMPO ORDINARIO.epub'
          test ! -f 'app/src/main/assets/epubs/Liturgia-horarum-2026-latin.epub'

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Compute APK SHA-256
        run: sha256sum app/build/outputs/apk/debug/app-debug.apk | tee app/build/outputs/apk/debug/app-debug.apk.sha256

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Ministerium-3.1.1-final-debug
          path: |
            recovered-v3/app/build/outputs/apk/debug/app-debug.apk
            recovered-v3/app/build/outputs/apk/debug/app-debug.apk.sha256
            recovered-v3/app/src/main/assets/hours-clean/manifest.json
            recovered-v3/app/src/main/assets/hours-clean/latin/2026/manifest.json
            recovered-v3/app/src/main/assets/missal/manifest.json
            recovered-v3/app/src/main/assets/rituals/liturgiapapal/manifest.json
          if-no-files-found: error
          retention-days: 14

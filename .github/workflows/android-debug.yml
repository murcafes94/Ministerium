name: Ministerium Android Debug

on:
  workflow_dispatch:
  push:
    branches:
      - fix/combined-mass-single-flow
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-debug:
    name: Build debug APK
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: recovered-v3

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Ministerium-debug
          path: recovered-v3/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

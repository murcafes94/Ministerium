name: Ministerium 5 Preview

on:
  workflow_dispatch:
  push:
    branches:
      - feature/ministerium-5.0

permissions:
  contents: read
  actions: write

jobs:
  build-preview:
    name: Build Ministerium 5 preview APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: recovered-v3

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify preview launcher
        run: |
          test -s app/src/main/java/com/fabri/ministerium/MainActivityV5.java
          grep -q 'MainActivityV5' app/src/main/AndroidManifest.xml
          python - <<'PY'
          from xml.etree import ElementTree
          ElementTree.parse('app/src/main/AndroidManifest.xml')
          print('Ministerium 5 manifest: XML OK')
          PY

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Build preview APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Compute APK SHA-256
        run: sha256sum app/build/outputs/apk/debug/app-debug.apk | tee app/build/outputs/apk/debug/app-debug.apk.sha256

      - name: Upload preview APK
        uses: actions/upload-artifact@v4
        with:
          name: Ministerium-5.0-preview
          path: |
            recovered-v3/app/build/outputs/apk/debug/app-debug.apk
            recovered-v3/app/build/outputs/apk/debug/app-debug.apk.sha256
          if-no-files-found: error
          retention-days: 14

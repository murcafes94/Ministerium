name: Recovery PR Build

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/recovery-pr-build.yml'
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
    paths:
      - 'recovered-v3/**'
      - '.github/workflows/recovery-pr-build.yml'
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  build:
    name: Build recovered Ministerium 3.0
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: recovered-v3

    steps:
      - name: Checkout recovery branch
        uses: actions/checkout@v5
        with:
          ref: fix/combined-mass-single-flow

      - name: Set up JDK 17 for Android SDK tools
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK 30
        run: sdkmanager 'platform-tools' 'platforms;android-30' 'build-tools;30.0.3'

      - name: Set up JDK 11 for Gradle 6.7.1 / AGP 4.2.1
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '11'
          cache: gradle
          cache-dependency-path: recovered-v3/**/*.gradle*

      - name: Validate recovered source
        shell: bash
        run: |
          set -euo pipefail
          java -version
          test -f settings.gradle
          test -f build.gradle
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/java/com/fabri/ministerium/CombinedMassActivity.java
          test -f app/src/main/java/com/fabri/ministerium/CombinedMassComposer.java
          test -f app/src/main/java/com/fabri/ministerium/CombinedMassPolisher.java
          grep -q "versionName '3.0.0'" app/build.gradle
          grep -q 'CombinedMassPolisher.compose' app/src/main/java/com/fabri/ministerium/CombinedMassActivity.java
          grep -q 'Liturgia de la Palabra' app/src/main/java/com/fabri/ministerium/CombinedMassComposer.java
          grep -q 'setPrayer(4)' app/src/main/java/com/fabri/ministerium/CombinedMassComposer.java
          grep -q 'Niceno-constantinopolitano' app/src/main/java/com/fabri/ministerium/CombinedMassComposer.java

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Compile debug APK
        id: gradle_build
        shell: bash
        run: |
          set -o pipefail
          ./gradlew --no-daemon --stacktrace clean assembleDebug 2>&1 | tee gradle-build.log

      - name: Generate SHA-256
        shell: bash
        run: |
          set -euo pipefail
          APK=$(find app/build/outputs/apk/debug -name '*.apk' -type f | head -n 1)
          test -n "$APK"
          test -s "$APK"
          sha256sum "$APK" | tee apk-sha256.txt

      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: Ministerium-3.0-recovered-debug
          path: |
            recovered-v3/app/build/outputs/apk/debug/*.apk
            recovered-v3/apk-sha256.txt
          if-no-files-found: error
          retention-days: 14

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Ministerium-3.0-build-log
          path: recovered-v3/gradle-build.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Comment diagnostic on recovery PR
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo '### Diagnóstico automático de compilación'
            echo
            echo 'La compilación de `recovered-v3` falló. Últimas líneas del log:'
            echo
            echo '```text'
            if [ -f gradle-build.log ]; then
              tail -n 160 gradle-build.log
            else
              echo 'El fallo ocurrió antes de iniciar Gradle.'
            fi
            echo '```'
            echo
            echo "Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          } > build-diagnostic.md
          gh pr comment 3 --repo "$GITHUB_REPOSITORY" --body-file build-diagnostic.md

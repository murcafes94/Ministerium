name: Mass Semantic 3.1 Build

on:
  push:
    branches: [ feature/mass-semantic-v3.1-source ]
  pull_request:
    branches:
      - fix/combined-mass-single-flow
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: recovered-v3

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate semantic Mass models
        shell: bash
        run: |
          set -euo pipefail
          test -f app/src/main/java/com/fabri/ministerium/liturgy/mass/MassSectionType.java
          test -f app/src/main/java/com/fabri/ministerium/liturgy/mass/MassSection.java
          test -f app/src/main/java/com/fabri/ministerium/liturgy/mass/MassCelebration.java
          test -f app/src/main/java/com/fabri/ministerium/liturgy/mass/ChantResource.java
          grep -q 'EUCHARISTIC_PRAYER' app/src/main/java/com/fabri/ministerium/liturgy/mass/MassSectionType.java
          grep -q 'LORD_PRAYER' app/src/main/java/com/fabri/ministerium/liturgy/mass/MassSectionType.java
          grep -q 'DISMISSAL' app/src/main/java/com/fabri/ministerium/liturgy/mass/MassSectionType.java

      - name: Set up JDK 17 for Android SDK tools
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-30 build-tools;30.0.3'

      - name: Set up JDK 11 for Gradle 6.7.1 / AGP 4.2.1
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
          cache: gradle
          cache-dependency-path: recovered-v3/**/*.gradle*

      - name: Validate existing integrated Mass contract
        shell: bash
        run: |
          set -euo pipefail
          if [ -f tools/validate_project.mjs ]; then node tools/validate_project.mjs; fi
          if [ -f tools/validate_content.mjs ]; then node tools/validate_content.mjs; fi
          if [ -f tools/validate_combined_mass.mjs ]; then node tools/validate_combined_mass.mjs; fi

      - name: Compile debug APK
        shell: bash
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon clean assembleDebug

      - name: Calculate APK SHA-256
        shell: bash
        run: sha256sum app/build/outputs/apk/debug/*.apk | tee apk-sha256.txt

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Ministerium-mass-semantic-3.1-debug
          path: |
            recovered-v3/app/build/outputs/apk/debug/*.apk
            recovered-v3/apk-sha256.txt
          if-no-files-found: error
          retention-days: 7
